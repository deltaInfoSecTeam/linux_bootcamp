services:
  bootcamp:
    build: .
    container_name: linux_bootcamp
    restart: unless-stopped
    # Standard: nur lokal erreichbar. Mit HTTPS (Profil "tls") nimmt nginx die
    # Verbindungen an; dieser Port bleibt dann auf 127.0.0.1.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8000}:8000"
    volumes:
      # Datenbank und automatisch erzeugte Secrets bleiben auf dem Host erhalten
      - ./data:/app/data
    # Wird von scripts/install.sh aus .env.example angelegt
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=8000
      - DATA_DIR=/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # HTTPS-Terminierung. Nur aktiv mit COMPOSE_PROFILES=tls (scripts/install.sh --tls)
  nginx:
    image: nginx:1.27-alpine
    profiles: ["tls"]
    container_name: linux_bootcamp_nginx
    restart: unless-stopped
    depends_on:
      bootcamp:
        condition: service_healthy
    ports:
      - "${TLS_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${TLS_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/bootcamp.conf:/etc/nginx/conf.d/default.conf:ro
      # Nur Server-Zertifikat, -Schlüssel und das öffentliche CA-Zertifikat;
      # der CA-Schlüssel (deploy/tls/ca/) wird bewusst nicht eingebunden.
      - ./deploy/tls/certs:/etc/nginx/certs:ro
    environment:
      - NGINX_ENTRYPOINT_QUIET_LOGS=1
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /run
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  # DNS fürs Heimnetz: löst DNS_NAME (z.B. bootcamp.internal) auf diesen Server
  # auf und leitet alles andere an den Router weiter.
  # Nur aktiv mit COMPOSE_PROFILES=...,dns (scripts/install.sh --dns NAME)
  #
  # Läuft im Host-Netzwerk: dnsmasq lauscht direkt auf dem LAN-Interface und
  # antwortet immer mit dessen aktueller Adresse. IP-Wechsel, Neustarts oder
  # eine später hinzukommende IPv6-ULA brauchen keinen neuen Skriptlauf.
  dns:
    build: ./deploy/dns
    profiles: ["dns"]
    container_name: linux_bootcamp_dns
    restart: unless-stopped
    network_mode: host
    volumes:
      # Wird von scripts/install.sh erzeugt
      - ./deploy/dns/bootcamp.conf:/etc/dnsmasq.d/bootcamp.conf:ro
    healthcheck:
      test: ["CMD", "nslookup", "-type=a", "${DNS_NAME:-localhost}", "127.0.0.1"]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    tmpfs:
      - /run
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
