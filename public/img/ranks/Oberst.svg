<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200" width="100" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a5320"/>
      <stop offset="100%" stop-color="#3a4018"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d0d0d0"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7a8"/>
      <stop offset="40%" stop-color="#e2ba46"/>
      <stop offset="100%" stop-color="#aa7c11"/>
    </linearGradient>
    <linearGradient id="altgoldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0ca8b"/>
      <stop offset="50%" stop-color="#c98138"/>
      <stop offset="100%" stop-color="#914d14"/>
    </linearGradient>
  </defs>
  <!-- Base Shoulder Board: thick to be visible when small -->
  <rect x="15" y="5" width="70" height="190" rx="10" fill="url(#bgGrad)" stroke="#1a2010" stroke-width="3"/>
  
        <path d="M 22 160 C 10 125, 90 125, 78 160 C 80 200, 20 200, 22 160" fill="none" stroke="url(#silverGrad)" stroke-width="10" stroke-linecap="round"/>
        <path d="M 35 180 L 65 180" stroke="url(#silverGrad)" stroke-width="6"/>
    
        <polygon points="50,97 57,110 70,115 57,120 50,133 43,120 30,115 43,110" fill="url(#silverGrad)" stroke="#222" stroke-width="1.5"/>
        <circle cx="50" cy="115" r="3" fill="#333" opacity="0.6"/>
    
        <polygon points="50,47 57,60 70,65 57,70 50,83 43,70 30,65 43,60" fill="url(#silverGrad)" stroke="#222" stroke-width="1.5"/>
        <circle cx="50" cy="65" r="3" fill="#333" opacity="0.6"/>
    
        <polygon points="50,-3 57,10 70,15 57,20 50,33 43,20 30,15 43,10" fill="url(#silverGrad)" stroke="#222" stroke-width="1.5"/>
        <circle cx="50" cy="15" r="3" fill="#333" opacity="0.6"/>
    
</svg>