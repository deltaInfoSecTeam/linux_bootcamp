<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200" width="100" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a3038"/>
      <stop offset="100%" stop-color="#181c22"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d0d0d0"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7a8"/>
      <stop offset="40%" stop-color="#e2ba46"/>
      <stop offset="100%" stop-color="#aa7c11"/>
    </linearGradient>
    <linearGradient id="altgoldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0ca8b"/>
      <stop offset="50%" stop-color="#c98138"/>
      <stop offset="100%" stop-color="#914d14"/>
    </linearGradient>
  </defs>
  <!-- Base Shoulder Board -->
  <rect x="15" y="5" width="70" height="190" rx="10" fill="url(#bgGrad)" stroke="#0b0d10" stroke-width="3"/>
  <rect x="25" y="15" width="50" height="175" fill="none" stroke="url(#altgoldGrad)" stroke-width="18"/>
</svg>