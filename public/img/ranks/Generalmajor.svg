        <polygon points="50,37 57,50 70,55 57,60 50,73 43,60 30,55 43,50" fill="url(#goldGrad)" stroke="#222" stroke-width="1.5"/>
        <circle cx="50" cy="55" r="3" fill="#333" opacity="0.6"/>
    
</svg>