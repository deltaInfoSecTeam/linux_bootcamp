<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200" width="100" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a5320"/>
      <stop offset="100%" stop-color="#3a4018"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d0d0d0"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7a8"/>
      <stop offset="40%" stop-color="#e2ba46"/>
      <stop offset="100%" stop-color="#aa7c11"/>
    </linearGradient>
    <linearGradient id="altgoldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0ca8b"/>
      <stop offset="50%" stop-color="#c98138"/>
      <stop offset="100%" stop-color="#914d14"/>
    </linearGradient>
  </defs>
  <!-- Base Shoulder Board: thick to be visible when small -->
  <rect x="15" y="5" width="70" height="190" rx="10" fill="url(#bgGrad)" stroke="#1a2010" stroke-width="3"/>
  <rect x="15" y="120" width="70" height="14" fill="url(#silverGrad)" stroke="#111" stroke-width="2"/><rect x="15" y="140" width="70" height="14" fill="url(#silverGrad)" stroke="#111" stroke-width="2"/><rect x="15" y="160" width="70" height="14" fill="url(#silverGrad)" stroke="#111" stroke-width="2"/>
</svg>