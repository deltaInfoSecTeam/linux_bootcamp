
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200" width="100" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a5320"/>
      <stop offset="100%" stop-color="#3a4018"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d0d0d0"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7a8"/>
      <stop offset="50%" stop-color="#e2ba46"/>
      <stop offset="100%" stop-color="#aa7c11"/>
    </linearGradient>
  </defs>
  <!-- Base Shoulder Board -->
  <rect x="15" y="5" width="70" height="190" rx="10" fill="url(#bgGrad)" stroke="#1a2010" stroke-width="2"/>
  
  <!-- Geschlossene Tresse (Gold border for Feldwebel) -->
  <rect x="18" y="8" width="64" height="184" rx="8" fill="none" stroke="url(#goldGrad)" stroke-width="12"/>

</svg>