<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200" width="100" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a5320"/>
      <stop offset="100%" stop-color="#3a4018"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d0d0d0"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7a8"/>
      <stop offset="40%" stop-color="#e2ba46"/>
      <stop offset="100%" stop-color="#aa7c11"/>
    </linearGradient>
    <linearGradient id="altgoldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0ca8b"/>
      <stop offset="50%" stop-color="#c98138"/>
      <stop offset="100%" stop-color="#914d14"/>
    </linearGradient>
  </defs>
  <!-- Base Shoulder Board: thick to be visible when small -->
  <rect x="15" y="5" width="70" height="190" rx="10" fill="url(#bgGrad)" stroke="#1a2010" stroke-width="3"/>
  
        <polygon points="50,42 57,55 70,60 57,65 50,78 43,65 30,60 43,55" fill="url(#silverGrad)" stroke="#222" stroke-width="1.5"/>
        <circle cx="50" cy="60" r="3" fill="#333" opacity="0.6"/>
    
        <polygon points="50,92 57,105 70,110 57,115 50,128 43,115 30,110 43,105" fill="url(#silverGrad)" stroke="#222" stroke-width="1.5"/>
        <circle cx="50" cy="110" r="3" fill="#333" opacity="0.6"/>
    
        <polygon points="50,142 57,155 70,160 57,165 50,178 43,165 30,160 43,155" fill="url(#silverGrad)" stroke="#222" stroke-width="1.5"/>
        <circle cx="50" cy="160" r="3" fill="#333" opacity="0.6"/>
    
</svg>