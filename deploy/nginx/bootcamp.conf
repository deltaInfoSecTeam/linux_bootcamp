# nginx als TLS-Terminierung vor dem Bootcamp-Container.
# Aktiv mit dem Compose-Profil "tls" (scripts/install.sh --tls).
# Zertifikate liegen in deploy/tls/certs/ und werden vom Install-Skript erzeugt.

server_tokens off;

# --- HTTP: nur Weiterleitung auf HTTPS + CA-Zertifikat zum Installieren ----
server {
    listen 80 default_server;
    server_name _;

    # Öffentliches CA-Zertifikat, damit Geräte im Heimnetz es einfach
    # herunterladen und als vertrauenswürdig installieren können.
    location = /ca.crt {
        alias /etc/nginx/certs/ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="linux-bootcamp-ca.crt"';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS -> App ---------------------------------------------------------
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Die API nimmt höchstens ~300 KB JSON an
    client_max_body_size 1m;

    location = /ca.crt {
        alias /etc/nginx/certs/ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="linux-bootcamp-ca.crt"';
    }

    location / {
        proxy_pass http://bootcamp:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # LLM-Anfragen über /api/proxy dürfen bis zu 60 s dauern
        proxy_read_timeout 90s;
    }
}
