      <text x="1180" y="66" opacity="0.23">|</text>
      <text x="1180" y="86" opacity="0.32">6</text>
      <text x="1180" y="106" opacity="0.8">B</text>
      <text x="1216" y="104" opacity="0.1">~</text>
