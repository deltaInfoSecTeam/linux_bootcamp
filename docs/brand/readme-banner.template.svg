      <text x="1036" y="58" opacity="0.32">/</text>
      <text x="1036" y="78" opacity="0.8">1</text>
      <text x="1054" y="34" opacity="0.12">2</text>
      <text x="1054" y="54" opacity="0.18">D</text>
