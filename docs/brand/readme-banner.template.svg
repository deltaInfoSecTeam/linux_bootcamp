<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Linux Bootcamp – deltaInfoSec Training">
  <!-- README banner in the deltaInfoSec corporate design.
       Source template: scripts/brand-icons.sh inserts the crest at the CREST marker
       from public/img/brand/wappen.svg. Edit this template, not readme-banner.svg. -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.12" cy="0" r="0.7">
      <stop offset="0" stop-color="#e2a83a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e2a83a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#e2a83a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e2a83a" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#e2a83a" stop-opacity="0"/>
    </linearGradient>
    <filter id="rim" x="-5%" y="-5%" width="110%" height="110%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="2" result="grow"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.28"/>
      <feComposite in2="grow" operator="in" result="outline"/>
      <feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="1280" height="320" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="320" fill="#0a0c10"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
    <rect width="1280" height="320" fill="url(#glow)"/>
    <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#3fd68a">
